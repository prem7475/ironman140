version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: paceforge-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/paceforge
      - JWT_SECRET=paceforge_production_secret_key_2026
    depends_on:
      - mongo
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: paceforge-frontend
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

  mongo:
    image: mongo:latest
    container_name: paceforge-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
