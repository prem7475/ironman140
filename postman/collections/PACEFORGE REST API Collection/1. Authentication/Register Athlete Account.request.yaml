$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Prem Narayani",
      "email": "prem.narayani@paceforge.com",
      "password": "password123",
      "phone": "+91 9876543210",
      "nationality": "Indian"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('token', jsonData.token);
          console.log('Captured JWT Token:', jsonData.token);
      }
    language: text/javascript
order: 1000
